services:
  - type: web
    name: mecenai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MECENAI_MODEL
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: MECENAI_CONTACT_URL
        value: https://budzko.art/api/contact
