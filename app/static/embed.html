<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0c;--panel:#17150f;--line:#2b271f;--ink:#efe8dc;--mut:#a39a8a;--gold:#c9a96e;--gold2:#e4cc97;--me:#26221a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#2a2215 0%,transparent 60%),var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
a{color:var(--gold2)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.brand{font:600 34px/1 "Cormorant Garamond",serif;letter-spacing:.5px}
.brand i{color:var(--gold);font-style:italic}
.tag{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;margin-top:28px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
h2{font:500 26px/1.2 "Cormorant Garamond",serif;margin:0 0 6px}
.sub{color:var(--mut);font-size:13px;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-height:560px;overflow:auto;padding-right:4px}
.filters{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.f{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:12px Inter,sans-serif;cursor:pointer}
.f.on{color:var(--ink);border-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;transition:border-color .2s}.card:hover{border-color:#5b4c2c}
.art{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#222;display:block;margin-bottom:8px}
.a1{background:linear-gradient(160deg,#30475e 0%,#7d97a8 45%,#d9c7a3 100%)}
.a2{background:linear-gradient(200deg,#3c4a43 0%,#8fa39a 55%,#cdbf9f 100%)}
.a3{background:radial-gradient(circle at 40% 40%,#9fc4ff 0%,#2e5fa8 35%,#0d1730 75%)}
.t{font:600 17px/1.2 "Cormorant Garamond",serif}
.m{color:var(--mut);font-size:12px}
.badge{display:inline-block;margin-top:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.badge.ok{color:var(--gold2);border-color:#5b4c2c}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;height:620px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);color:var(--mut);font-size:13px}
.langs{display:flex;gap:6px}.langs button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:3px 9px;font:600 12px Inter,sans-serif;cursor:pointer}
.langs button.on{color:#17150f;background:var(--gold);border-color:var(--gold)}
.log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap}
.bot{background:#1e1b14;border:1px solid var(--line);align-self:flex-start}
.me{background:var(--me);align-self:flex-end}
.tools{font-size:11px;color:var(--gold);margin-top:6px;letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
.chip{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:13px Inter,sans-serif;cursor:pointer}
.chip:hover{color:var(--ink);border-color:#5b4c2c}
form{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
input{flex:1;background:#0f0e0c;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:15px Inter,sans-serif}
input:focus{outline:none;border-color:var(--gold)}
button.send{background:var(--gold);color:#17150f;border:0;border-radius:12px;padding:0 14px;font:600 14px Inter,sans-serif;cursor:pointer}
button.send:disabled{opacity:.5}
.how{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.how{grid-template-columns:1fr}}
.how div{border-top:1px solid var(--line);padding-top:12px;color:var(--mut);font-size:13px}
.how b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
code{background:#1e1b14;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--gold2)}
footer{margin-top:26px;color:var(--mut);font-size:12px}

html,body{height:100%;background:var(--panel)}
body{min-height:0}
.chat{height:100vh;border:0;border-radius:0}
.close{background:transparent;border:0;color:var(--mut);font-size:20px;cursor:pointer;margin-left:8px;line-height:1}
.note{font-size:11px;color:var(--mut);text-align:center;padding:0 12px 8px}
</style></head><body>
<section class="chat">
  <div class="bar"><span id="who">Concierge</span><div style="display:flex;align-items:center"><div class="langs" id="langs">
    <button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="ar">AR</button></div><button class="close" id="x" aria-label="Close">×</button></div></div>
  <div class="log" id="log"></div>
  <div class="chips" id="chips"></div>
  <form id="f"><input id="q" maxlength="500" placeholder="Ask about a painting…" autocomplete="off"><button class="send" id="b">Send</button></form>
  <div class="note">AI concierge · requests reach the artist only after you confirm</div>
</section>
<script>
const P=new URLSearchParams(location.search);const ART=(P.get('art')||'').replace(/[^a-z0-9-]/g,'').slice(0,60);let ARTT='';
const T={
 en:{who:'Concierge',hi:"Hello! I'm Katsiaryna Budzko's concierge. Ask me about her paintings, prices or availability.",
  ph:'Ask about a painting…',art:'You are looking at ',send:'Send',about:'Tell me about ',chips:['Which works are available now?','What do you have from Silent Lights?','Can I offer something in exchange for a painting?'],here:['How much is this painting?','Tell me the story of this painting']},
 ru:{who:'Консьерж',hi:'Здравствуйте! Я консьерж художницы Катерины Будзько. Спросите о её картинах, ценах или наличии.',
  ph:'Спросите о картине…',art:'Вы смотрите картину ',send:'Отправить',about:'Расскажите о картине ',chips:['Какие работы сейчас в наличии?','Что есть из серии Silent Lights?','Можно предложить обмен вместо оплаты?'],here:['Сколько стоит эта картина?','Расскажите историю этой картины']},
 ar:{who:'المساعد',hi:'مرحباً! أنا مساعد الفنانة كاتسيارينا بودزكو. اسألني عن لوحاتها وأسعارها وتوفرها.',
  ph:'اسأل عن لوحة…',art:'أنت تشاهد لوحة ',send:'إرسال',about:'أخبرني عن لوحة ',chips:['ما هي الأعمال المتوفرة الآن؟','ما هي أعمال سلسلة Silent Lights؟','هل يمكنني عرض مقايضة بدل الدفع؟'],here:['كم سعر هذه اللوحة؟','أخبرني بقصة هذه اللوحة']}};
let LANG=(()=>{const pl=P.get('lang');if(T[pl])return pl;try{const s=localStorage.getItem('mecenai_lang');if(T[s])return s}catch(e){}const n=(navigator.language||'en').slice(0,2);return T[n]?n:'en'})();
function setLang(l,keepLog){LANG=l;try{localStorage.setItem('mecenai_lang',l)}catch(e){}const t=T[l],chat=document.querySelector('.chat');
 chat.dir=l==='ar'?'rtl':'ltr';document.getElementById('who').textContent=t.who;q.placeholder=t.ph;b.textContent=t.send;
 document.querySelectorAll('#langs button').forEach(x=>x.classList.toggle('on',x.dataset.l===l));
 const c=document.getElementById('chips');c.innerHTML='';(ARTT?t.here:t.chips).forEach(x=>{const e=document.createElement('button');e.className='chip';e.textContent=x;e.onclick=()=>ask(x);c.appendChild(e)});
 if(!keepLog){log.innerHTML='';hist.length=0;add(t.hi+(ARTT?' '+t.art+ARTT+'.':''),'bot')}}
function detect(text){if(/[\u0600-\u06FF]/.test(text))return 'ar';if(/[\u0400-\u04FF]/.test(text))return 'ru';if(/[a-z]{3,}/i.test(text))return 'en';return LANG}
const hist=[];const log=document.getElementById('log'),f=document.getElementById('f'),q=document.getElementById('q'),b=document.getElementById('b');

function add(text,cls,tools){const d=document.createElement('div');d.className='msg '+cls;
 String(text).replace(/\*\*/g,'').replace(/<(https?:[^>]+)>/g,'$1').split(/(https:\/\/budzko\.art\/[^\s)»"'<>]*)/).forEach((part,i)=>{if(i%2){const a=document.createElement('a');a.href=part;a.target='_blank';a.rel='noopener';a.textContent=part.replace('https://','');d.appendChild(a)}else d.appendChild(document.createTextNode(part))});
 
 log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function ask(text){if(!text.trim())return;const d=detect(text);if(d!==LANG)setLang(d,true);add(text,'me');q.value='';b.disabled=true;const wait=add('…','bot');
 try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:hist.slice(-10),lang:LANG,artwork_id:ART||null})});
  const j=await r.json();wait.remove();add(r.ok?j.reply:(j.detail||'Please try again.'),'bot',r.ok?j.tool_calls:[]);if(r.ok){hist.push({role:'user',content:text},{role:'assistant',content:j.reply,sig:j.sig})}}
 catch(e){wait.remove();add('Connection problem — please try again.','bot')}b.disabled=false;q.focus()}
f.onsubmit=e=>{e.preventDefault();ask(q.value)};
document.querySelectorAll('#langs button').forEach(x=>x.onclick=()=>setLang(x.dataset.l,false));document.getElementById('x').onclick=()=>parent.postMessage({mecenai:'close'},'*');
if(ART){fetch('/catalog').then(r=>r.json()).then(c=>{const a=c.artworks.find(x=>x.id===ART);if(a){ARTT=a.title}setLang(LANG,false)}).catch(()=>setLang(LANG,false))}else setLang(LANG,false);
</script>
</body></html>
